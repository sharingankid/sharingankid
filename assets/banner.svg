<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0b0e"/>
      <stop offset="0.6" stop-color="#121217"/>
      <stop offset="1" stop-color="#1a0b10"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.5" r="0.45">
      <stop offset="0" stop-color="#e11d48" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#e11d48" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#fda4af"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
    <clipPath id="card"><rect width="1200" height="320" rx="18"/></clipPath>
    <style>
      .mono{font-family:'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Liberation Mono',monospace}
      .sans{font-family:'Segoe UI','Inter',-apple-system,Helvetica,Arial,sans-serif}
      .cursor{animation:blink 1.1s steps(1) infinite}
      @keyframes blink{50%{opacity:0}}
      .spin{transform-origin:990px 160px;animation:spin 14s linear infinite}
      .spin-rev{transform-origin:990px 160px;animation:spin 22s linear infinite reverse}
      @keyframes spin{to{transform:rotate(360deg)}}
      .pulse{animation:pulse 2.4s ease-in-out infinite}
      @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
      .scan{animation:scan 5s ease-in-out infinite}
      @keyframes scan{0%{transform:translateY(-40px);opacity:0}15%{opacity:.5}85%{opacity:.5}100%{transform:translateY(360px);opacity:0}}
      .fade{animation:fade 1.2s ease-out both}
      .fade2{animation:fade 1.2s .3s ease-out both}
      .fade3{animation:fade 1.2s .6s ease-out both}
      @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#grid)"/>
    <rect width="1200" height="320" fill="url(#glow)"/>
    <rect class="scan" x="0" y="0" width="1200" height="2" fill="#e11d48" opacity="0.4"/>

    <!-- window bar -->
    <circle cx="40" cy="36" r="6" fill="#ff5f57"/>
    <circle cx="60" cy="36" r="6" fill="#febc2e"/>
    <circle cx="80" cy="36" r="6" fill="#28c840"/>
    <text x="104" y="41" class="mono" font-size="13" fill="#6b6b78">~/sharingankid — zsh</text>

    <!-- prompt -->
    <g class="fade">
      <text x="64" y="104" class="mono" font-size="20" fill="#9a9aa8"><tspan fill="#e11d48">$</tspan> whoami</text>
    </g>

    <!-- name -->
    <g class="fade2">
      <text x="60" y="178" class="mono" font-size="68" font-weight="700" fill="url(#title)" letter-spacing="-1">sharingankid<tspan class="cursor" fill="#e11d48" dx="6">_</tspan></text>
    </g>

    <!-- subtitle -->
    <g class="fade3">
      <text x="64" y="222" class="sans" font-size="22" fill="#d4d4dc">Développeur Fullstack <tspan fill="#e11d48">·</tspan> Cybersécurité <tspan fill="#e11d48">·</tspan> Low-level</text>
      <!-- tags -->
      <g class="mono" font-size="14">
        <rect x="64" y="246" width="70" height="30" rx="15" fill="none" stroke="#e11d48" stroke-opacity="0.6"/>
        <text x="99" y="266" text-anchor="middle" fill="#fda4af">C</text>
        <rect x="144" y="246" width="96" height="30" rx="15" fill="none" stroke="#ffffff" stroke-opacity="0.18"/>
        <text x="192" y="266" text-anchor="middle" fill="#c8c8d2">Python</text>
        <rect x="250" y="246" width="128" height="30" rx="15" fill="none" stroke="#ffffff" stroke-opacity="0.18"/>
        <text x="314" y="266" text-anchor="middle" fill="#c8c8d2">JavaScript</text>
        <rect x="388" y="246" width="86" height="30" rx="15" fill="none" stroke="#ffffff" stroke-opacity="0.18"/>
        <text x="431" y="266" text-anchor="middle" fill="#c8c8d2">Linux</text>
        <rect x="484" y="246" width="96" height="30" rx="15" fill="none" stroke="#ffffff" stroke-opacity="0.18"/>
        <text x="532" y="266" text-anchor="middle" fill="#c8c8d2">DevOps</text>
      </g>
    </g>

    <!-- radar -->
    <g>
      <circle cx="990" cy="160" r="118" fill="none" stroke="#ffffff" stroke-opacity="0.07"/>
      <circle cx="990" cy="160" r="84" fill="none" stroke="#ffffff" stroke-opacity="0.09"/>
      <circle cx="990" cy="160" r="50" fill="none" stroke="#ffffff" stroke-opacity="0.11"/>
      <line x1="872" y1="160" x2="1108" y2="160" stroke="#ffffff" stroke-opacity="0.06"/>
      <line x1="990" y1="42" x2="990" y2="278" stroke="#ffffff" stroke-opacity="0.06"/>
      <g class="spin">
        <circle cx="990" cy="160" r="118" fill="none" stroke="#e11d48" stroke-width="2" stroke-dasharray="120 621" stroke-linecap="round"/>
        <path d="M990 160 L1108 160 A118 118 0 0 0 1073.4 76.6 Z" fill="#e11d48" fill-opacity="0.10"/>
      </g>
      <g class="spin-rev">
        <circle cx="990" cy="160" r="84" fill="none" stroke="#fda4af" stroke-opacity="0.7" stroke-width="1.5" stroke-dasharray="4 10"/>
      </g>
      <circle class="pulse" cx="990" cy="160" r="7" fill="#e11d48"/>
      <circle class="pulse" cx="1040" cy="110" r="3.5" fill="#fda4af"/>
      <circle class="pulse" cx="935" cy="215" r="3" fill="#fda4af" style="animation-delay:1.2s"/>
      <text x="990" y="302" text-anchor="middle" class="mono" font-size="12" fill="#6b6b78">Holberton School · Toulouse</text>
    </g>

    <rect x="0" y="316" width="1200" height="4" fill="#e11d48" opacity="0.8"/>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="319" rx="18" fill="none" stroke="#ffffff" stroke-opacity="0.06"/>
</svg>
